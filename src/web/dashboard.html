<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitch Watcher - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0e0e10;
            color: #efeff1;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            color: #9147ff;
            margin-bottom: 10px;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: #18181b;
            border-radius: 20px;
            border: 1px solid #26262c;
            font-size: 14px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.online {
            background: #00d166;
        }

        .status-dot.offline {
            background: #adadb8;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.7;
                transform: scale(1.1);
            }
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-online {
            background: #00d166;
        }

        .status-offline {
            background: #adadb8;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #18181b;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #26262c;
        }

        .stat-card h3 {
            color: #adadb8;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: 700;
            color: #efeff1;
        }

        .stat-card .label {
            font-size: 12px;
            color: #adadb8;
            margin-top: 5px;
        }

        .section {
            background: #18181b;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #26262c;
        }

        .section h2 {
            color: #efeff1;
            margin-bottom: 20px;
            font-size: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #26262c;
        }

        th {
            color: #adadb8;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
        }

        td {
            color: #efeff1;
        }

        .streamer-name {
            font-weight: 600;
            color: #9147ff;
        }

        .chart-container {
            position: relative;
            height: 300px;
            margin-top: 20px;
        }

        .events-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .event-item {
            padding: 10px;
            border-bottom: 1px solid #26262c;
            font-size: 14px;
        }

        .event-item:last-child {
            border-bottom: none;
        }

        .event-time {
            color: #adadb8;
            font-size: 12px;
        }

        .event-type {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-right: 8px;
        }

        .event-type-points {
            background: #9147ff;
            color: white;
        }

        .event-type-stream {
            background: #00d166;
            color: white;
        }

        .event-type-claim {
            background: #ffc107;
            color: #000;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #adadb8;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading::after {
            content: '...';
            animation: pulse 1.5s infinite;
        }

        .toggle-btn {
            background: #9147ff;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .toggle-btn:hover {
            background: #772ce8;
        }

        .toggle-btn:active {
            background: #5c16c5;
        }

        .update-interval-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .interval-buttons {
            display: flex;
            gap: 4px;
        }

        .interval-btn {
            background: #18181b;
            color: #adadb8;
            border: 1px solid #26262c;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .interval-btn:hover {
            background: #26262c;
            color: #efeff1;
        }

        .interval-btn.active {
            background: #9147ff;
            color: white;
            border-color: #9147ff;
        }

        /* Анимации обновления */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .updating {
            animation: fadeIn 0.3s ease-in-out;
        }

        .stat-card.updating {
            animation: fadeIn 0.3s ease-in-out;
        }

        .event-item.new {
            animation: slideIn 0.4s ease-out;
            background: rgba(145, 71, 255, 0.1);
        }

        /* Адаптивный дизайн */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                max-width: 100%;
            }

            header {
                flex-direction: column;
                align-items: flex-start;
            }

            .stats-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .stat-card .value {
                font-size: 24px;
            }

            .section {
                padding: 15px;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 8px;
            }

            .chart-container {
                height: 200px;
            }

            .events-list {
                max-height: 300px;
            }

            .connection-status {
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 24px;
            }

            .stat-card {
                padding: 15px;
            }

            .stat-card .value {
                font-size: 20px;
            }

            table {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>Twitch Watcher Dashboard</h1>
                <p>Real-time monitoring and statistics</p>
            </div>
            <div style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
                <div class="update-interval-control">
                    <span style="color: #adadb8; font-size: 14px; margin-right: 8px;">Update:</span>
                    <div class="interval-buttons">
                        <button class="interval-btn active" data-interval="5">5s</button>
                        <button class="interval-btn" data-interval="10">10s</button>
                        <button class="interval-btn" data-interval="30">30s</button>
                        <button class="interval-btn" data-interval="60">1m</button>
                    </div>
                </div>
                <div class="connection-status" id="connectionStatus">
                    <span class="status-dot offline" id="statusDot"></span>
                    <span id="statusText">Connecting...</span>
                </div>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Active Watches</h3>
                <div class="value" id="activeWatches">0</div>
                <div class="label">Currently watching</div>
            </div>
            <div class="stat-card">
                <h3>Total Points</h3>
                <div class="value" id="totalPoints">0</div>
                <div class="label">Points earned</div>
            </div>
            <div class="stat-card">
                <h3>Streamers</h3>
                <div class="value" id="streamersCount">0</div>
                <div class="label">Total streamers</div>
            </div>
            <div class="stat-card">
                <h3>Last Activity</h3>
                <div class="value" id="lastActivity">-</div>
                <div class="label">Time ago</div>
            </div>
        </div>

        <div class="section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="margin: 0;">All Streamers</h2>
                <button id="toggleOfflineBtn" class="toggle-btn">
                    <span id="toggleOfflineText">Hide Offline</span>
                </button>
            </div>
            <div id="watchesTable">
                <div class="loading">Loading statistics</div>
            </div>
        </div>

        <div class="section">
            <h2>Points History</h2>
            <div class="chart-container">
                <canvas id="pointsChart"></canvas>
            </div>
        </div>

        <div class="section">
            <h2>Recent Events</h2>
            <div class="events-list" id="eventsList">
                <div class="loading">Loading events</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        let pointsChart = null;
        let updateInterval = null;
        let showOffline = true; // По умолчанию показываем всех стримеров
        let updateIntervalMs = 5000; // Интервал обновления в миллисекундах (по умолчанию 5 секунд)

        function formatTime(ms) {
            if (ms < 0) return '-';
            const seconds = Math.floor(ms / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            
            if (hours > 0) {
                return `${hours}h ${minutes % 60}m`;
            } else if (minutes > 0) {
                return `${minutes}m ${seconds % 60}s`;
            } else {
                return `${seconds}s`;
            }
        }

        function formatTimestamp(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleTimeString();
        }

        async function fetchData(endpoint) {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.json();
            } catch (error) {
                console.error(`Error fetching ${endpoint}:`, error);
                return null;
            }
        }

        function updateConnectionStatus(connected) {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            
            if (connected) {
                statusDot.classList.remove('offline');
                statusDot.classList.add('online');
                statusText.textContent = 'Connected';
            } else {
                statusDot.classList.remove('online');
                statusDot.classList.add('offline');
                statusText.textContent = 'Disconnected';
            }
        }

        async function updateOverallStats() {
            const stats = await fetchData('/overall');
            if (!stats) {
                updateConnectionStatus(false);
                return;
            }

            updateConnectionStatus(true);

            // Анимация обновления
            const cards = document.querySelectorAll('.stat-card');
            cards.forEach(card => {
                card.classList.add('updating');
                setTimeout(() => card.classList.remove('updating'), 300);
            });

            document.getElementById('activeWatches').textContent = stats.activeWatches || 0;
            document.getElementById('totalPoints').textContent = stats.totalPointsEarned || 0;
            document.getElementById('streamersCount').textContent = stats.streamersCount || 0;
            document.getElementById('lastActivity').textContent = formatTime(stats.lastActivity || 0);
        }

        async function updateStatistics() {
            // Запрашиваем всех стримеров, включая офлайн
            const stats = await fetchData('/statistics?includeOffline=true');
            if (!stats) return;

            const table = document.getElementById('watchesTable');
            
            if (stats.length === 0) {
                table.innerHTML = '<p style="color: #adadb8; text-align: center; padding: 20px;">No streamers configured</p>';
                return;
            }

            // Фильтруем офлайн стримеров, если они скрыты
            let filteredStats = stats;
            if (!showOffline) {
                filteredStats = stats.filter(s => s.status === 'ONLINE');
            }

            // Сортируем: сначала онлайн, потом офлайн, внутри группы - по имени
            const sortedStats = [...filteredStats].sort((a, b) => {
                if (a.status === 'ONLINE' && b.status === 'OFFLINE') return -1;
                if (a.status === 'OFFLINE' && b.status === 'ONLINE') return 1;
                // Если оба онлайн или оба офлайн, сортируем по имени
                return a.streamerName.localeCompare(b.streamerName);
            });

            // Анимация обновления
            table.classList.add('updating');
            
            table.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Streamer</th>
                            <th>Status</th>
                            <th>Watch Time</th>
                            <th>Points Earned</th>
                            <th>Current Points</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${sortedStats.map(s => `
                            <tr>
                                <td class="streamer-name">${s.streamerName}</td>
                                <td>
                                    <span class="status-indicator ${s.status === 'ONLINE' ? 'status-online' : 'status-offline'}"></span>
                                    ${s.status}
                                </td>
                                <td>${formatTime(s.elapsedTime)}</td>
                                <td>${s.pointsEarned}</td>
                                <td>${s.currentPoints}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;

            setTimeout(() => table.classList.remove('updating'), 300);
        }

        async function updatePointsChart() {
            const history = await fetchData('/points-history?limit=200');
            if (!history || history.length === 0) {
                // Если истории нет, показываем пустой график
                if (pointsChart) {
                    pointsChart.data.labels = [];
                    pointsChart.data.datasets = [];
                    pointsChart.update();
                }
                return;
            }

            const ctx = document.getElementById('pointsChart');
            
            // Группируем по стримерам и сортируем по времени
            const streamersMap = new Map();
            history.forEach(entry => {
                if (!streamersMap.has(entry.streamer)) {
                    streamersMap.set(entry.streamer, []);
                }
                streamersMap.get(entry.streamer).push({
                    x: new Date(entry.timestamp),
                    y: entry.points
                });
            });
            
            // Сортируем данные по времени для каждого стримера
            streamersMap.forEach((data, streamer) => {
                data.sort((a, b) => a.x.getTime() - b.x.getTime());
            });

            // Создаем цвета для каждого стримера
            const colors = [
                '#9147ff', '#00d166', '#ffc107', '#ff6b6b', '#4ecdc4',
                '#45b7d1', '#f7b731', '#5f27cd', '#00d2d3', '#ff6348'
            ];
            let colorIndex = 0;

            const datasets = Array.from(streamersMap.entries()).map(([streamer, data]) => {
                const color = colors[colorIndex % colors.length];
                colorIndex++;
                return {
                    label: streamer,
                    data: data,
                    borderColor: color,
                    backgroundColor: color + '40', // Добавляем прозрачность
                    tension: 0.4,
                    fill: false,
                    pointRadius: 2,
                    pointHoverRadius: 4
                };
            });

            if (!pointsChart) {
                pointsChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        datasets: datasets
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: {
                            intersect: false,
                            mode: 'index'
                        },
                        animation: {
                            duration: 0
                        },
                        plugins: {
                            legend: {
                                labels: { 
                                    color: '#efeff1',
                                    usePointStyle: true,
                                    padding: 15
                                },
                                position: 'top'
                            },
                            tooltip: {
                                backgroundColor: 'rgba(0, 0, 0, 0.8)',
                                titleColor: '#efeff1',
                                bodyColor: '#efeff1',
                                borderColor: '#26262c',
                                borderWidth: 1,
                                callbacks: {
                                    title: function(context) {
                                        const date = new Date(context[0].parsed.x);
                                        return date.toLocaleTimeString();
                                    },
                                    label: function(context) {
                                        return `${context.dataset.label}: +${context.parsed.y} points`;
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                type: 'time',
                                time: {
                                    unit: 'second',
                                    displayFormats: {
                                        second: 'HH:mm:ss',
                                        minute: 'HH:mm:ss',
                                        hour: 'HH:mm:ss'
                                    },
                                    tooltipFormat: 'HH:mm:ss'
                                },
                                ticks: { 
                                    color: '#adadb8',
                                    maxTicksLimit: 12,
                                    source: 'data'
                                },
                                grid: { 
                                    color: '#26262c' 
                                },
                                title: {
                                    display: true,
                                    text: 'Time',
                                    color: '#adadb8'
                                },
                                bounds: 'data',
                                offset: false,
                                min: history.length > 0 ? new Date(Math.min(...history.map(e => e.timestamp))) : undefined
                            },
                            y: { 
                                ticks: { 
                                    color: '#adadb8' 
                                }, 
                                grid: { 
                                    color: '#26262c' 
                                },
                                title: {
                                    display: true,
                                    text: 'Points Earned',
                                    color: '#adadb8'
                                },
                                beginAtZero: true
                            }
                        }
                    }
                });
            } else {
                pointsChart.data.datasets = datasets;
                pointsChart.update(); // Обновляем график с анимацией
            }
        }

        let lastEventTimestamp = 0;

        async function updateEvents() {
            const events = await fetchData('/events?limit=20');
            if (!events) return;

            const list = document.getElementById('eventsList');
            
            if (events.length === 0) {
                list.innerHTML = '<p style="color: #adadb8; text-align: center; padding: 20px;">No events yet</p>';
                lastEventTimestamp = 0;
                return;
            }

            // Определяем новые события
            const newEvents = events.filter(e => e.timestamp > lastEventTimestamp);
            if (events.length > 0) {
                lastEventTimestamp = events[0].timestamp;
            }

            list.innerHTML = events.map((event, index) => {
                const typeClass = event.type.includes('point') ? 'event-type-points' :
                                 event.type.includes('stream') ? 'event-type-stream' :
                                 event.type.includes('claim') ? 'event-type-claim' : '';
                
                const isNew = newEvents.some(ne => ne.timestamp === event.timestamp && ne.streamer === event.streamer);
                
                return `
                    <div class="event-item ${isNew ? 'new' : ''}" data-timestamp="${event.timestamp}">
                        <span class="event-time">${formatTimestamp(event.timestamp)}</span>
                        <span class="event-type ${typeClass}">${event.type}</span>
                        <strong>${event.streamer}</strong>: ${event.message}
                    </div>
                `;
            }).join('');

            // Убираем класс new после анимации
            setTimeout(() => {
                document.querySelectorAll('.event-item.new').forEach(item => {
                    item.classList.remove('new');
                });
            }, 400);
        }

        async function updateAll() {
            await Promise.all([
                updateOverallStats(),
                updateStatistics(),
                updateEvents(),
                updatePointsChart()
            ]);
        }

        function setUpdateInterval(seconds) {
            updateIntervalMs = seconds * 1000;
            
            // Обновляем активную кнопку
            document.querySelectorAll('.interval-btn').forEach(btn => {
                btn.classList.remove('active');
                if (parseInt(btn.dataset.interval) === seconds) {
                    btn.classList.add('active');
                }
            });
            
            // Перезапускаем автообновление с новым интервалом
            if (updateInterval) {
                clearInterval(updateInterval);
            }
            updateInterval = setInterval(updateAll, updateIntervalMs);
        }

        function startAutoUpdate() {
            updateAll();
            updateInterval = setInterval(updateAll, updateIntervalMs);
            
            // Проверка подключения при старте
            updateConnectionStatus(false);
        }

        function toggleOfflineStreamers() {
            showOffline = !showOffline;
            const toggleBtn = document.getElementById('toggleOfflineBtn');
            const toggleText = document.getElementById('toggleOfflineText');
            
            if (showOffline) {
                toggleText.textContent = 'Hide Offline';
            } else {
                toggleText.textContent = 'Show Offline';
            }
            
            // Обновляем таблицу
            updateStatistics();
        }

        window.addEventListener('load', () => {
            startAutoUpdate();
            
            // Добавляем обработчик для кнопки переключения офлайн стримеров
            const toggleBtn = document.getElementById('toggleOfflineBtn');
            if (toggleBtn) {
                toggleBtn.addEventListener('click', toggleOfflineStreamers);
            }
            
            // Добавляем обработчики для кнопок интервала обновления
            document.querySelectorAll('.interval-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const interval = parseInt(btn.dataset.interval);
                    setUpdateInterval(interval);
                });
            });
        });

        window.addEventListener('beforeunload', () => {
            if (updateInterval) {
                clearInterval(updateInterval);
            }
        });
    </script>
</body>
</html>
