<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Integrity Bridge</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h1>Integrity Bridge</h1>
  <p class="hint">Откройте twitch.tv в этой же сессии Edge — токен подхватится из gql.</p>

  <label>
    <span>URL бота</span>
    <input id="botUrl" type="url" placeholder="http://127.0.0.1:3001" />
  </label>

  <label>
    <span>API-ключ (WEB_DASHBOARD_API_KEY)</span>
    <input id="apiKey" type="password" placeholder="если задан в config" autocomplete="off" />
  </label>

  <label class="row">
    <input id="enabled" type="checkbox" checked />
    <span>Передавать integrity в бот</span>
  </label>

  <hr class="section-divider" />

  <h2 class="section-title">Уведомления о стримах</h2>
  <p class="hint">События stream-up и stream-down с локального бота (без открытого дашборда).</p>

  <button id="toggleStreamNotify" type="button" class="btn-notify off">Уведомления: выкл</button>
  <p id="streamNotifyHint" class="hint hotkey">Горячая клавиша: Ctrl+Shift+Y — настроить в <code>edge://extensions/shortcuts</code></p>

  <div class="actions">
    <button id="test" type="button" class="btn-primary">Проверить бота</button>
    <button id="save" type="button" class="btn-secondary">Сохранить настройки</button>
  </div>

  <p id="status" class="status">—</p>

  <script src="popup.js"></script>
</body>
</html>
